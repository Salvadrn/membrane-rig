# =============================================================================
# Membrane permeability test rig — configuration
# All parameters here can be changed WITHOUT editing code.
# Every pressure value is expressed in `units` (kPa or psi); the software
# converts everything to kPa internally.
# =============================================================================

units: kPa            # kPa or psi  -> unit for every pressure below + the UI
mode: sim             # sim | hardware   (sim runs the whole logic with no I/O)

# ------------------------------------------------------------------ sensor ---
sensor:
  # Front-end type (only used in hardware mode):
  #   current_loop    -> 4-20 mA sensor read as voltage across a shunt resistor
  #   voltage_divider -> 0.5-4.5 V (or 0-5V) sensor scaled into the ADS1115 range
  # The chosen transducer is a 0.5-4.5 V unit -> voltage_divider. Power the
  # ADS1115 at 3.3 V and use a 10k/22k divider (4.5 V -> ~3.1 V) so the signal
  # never exceeds the ADC input. Do NOT feed 0.5-4.5 V straight in.
  type: voltage_divider   # sensor is 0.5-4.5 V ratiometric -> MUST divide, not raw
  range_min: 0.0       # kPa at 0.5 V
  range_max: 103.4     # kPa at 4.5 V  (0-15 PSI sensor = 0-103.4 kPa; tests top out ~60 kPa)

  # ADS1115
  ads_channel: 0       # single-ended channel A0..A3
  ads_gain: 1          # 1 -> +/-4.096 V full scale (see README)
  read_hz: 20

  # --- current_loop front-end ---
  # 4-20 mA through a precision shunt. With 150 ohm: 4mA->0.60V, 20mA->3.00V,
  # comfortably inside the ADS1115 +/-4.096V range at gain 1.
  shunt_ohms: 150.0
  signal_min: 0.004    # A  (4 mA)
  signal_max: 0.020    # A  (20 mA)

  # --- voltage_divider front-end ---
  # A 0.5-4.5V sensor exceeds the ADS1115 input at a 3.3V supply, so divide it.
  # divider_ratio = R2/(R1+R2). Built with R1=10k, R2=22k -> 0.6875: 4.5V -> ~3.1V
  # (22k because the resistor kit has no 20k; only the RATIO matters, and 0.6875
  # is just as safe: still under the ADC's 3.3V rail). NOMINAL VALUE ONLY —
  # replace it with the ratio you MEASURE on the soldered divider (step 3 of the
  # build order). This is NOT cosmetic: a wrong ratio is a pure scale error on
  # P, so it propagates straight into the Darcy slope. Checked against
  # fit_permeability: using 0.667 on a 0.6875 divider reports 60 kPa as 62.24
  # and biases k by -2.98% — with R2 UNCHANGED at 1.000000 and follows_darcy
  # still true. Nothing in the plot reveals it. Safe for the mesh (it
  # over-reports, so it aborts early), silently wrong for the result.
  # MEDIDO EN EL BANCO 2026-08-06, no nominal. Con el transductor en reposo
  # (0.500 V confirmado con multimetro en el cable verde) A0 leyo 0.3673 V,
  # asi que el ratio real es 0.3673/0.500 = 0.7346 — un 6.8 % arriba del
  # nominal 0.6875 que dan R1=10k y R2=22k ideales. Con el nominal el rig
  # reportaba +7 kPa a presion cero; con el medido reporta 0.01 kPa.
  # Ruido de fondo verificado: ±0.04 kPa.
  divider_ratio: 0.7346
  v_signal_min: 0.5    # V at range_min
  v_signal_max: 4.5    # V at range_max

# ----------------------------------------------------------- prop. valve ---
# Pressure-control valve. command 0..100 == "pressure authority":
#   0   -> LOWEST pressure  (== SAFE state)
#   100 -> HIGHEST pressure
# THIS RIG: air-over-water. Compressed AIR pressurises the vessel; a servo turns
# the EXISTING stainless 90° quarter-turn BALL VALVE on the air inlet (handle
# removed; the one the operator turns by hand today). Opening it admits air ->
# pressure UP; closing holds/lets it drift down as water permeates. So:
#   0%  -> ball CLOSED -> lowest pressure (SAFE)
#   100% -> ball OPEN   -> highest pressure
# It's quarter-turn: a ~2:1 reduction maps the servo's ~180° onto the 90° travel
# (see docs/ASSEMBLY.md). A ball valve has the most authority near-closed, so
# only part of that travel is useful — calibrate servo_min_us/max_us to the
# sub-range AROUND your setpoints (find it with the static valve-authority
# sweep). If closing is too slow to reject an overshoot, add a tiny fixed bleed
# orifice on the air line.
# type: servo  -> a servo turning the existing ball valve
# type: pwm    -> a MOSFET-driven proportional solenoid (see src/hal/pwm_valve.py)
valve:
  type: servo
  invert: true         # measured 2026-08-06: with false, 0% (the abort state) landed OPEN
  min_command: 0.0
  max_command: 100.0

  # --- servo on the air-inlet ball valve (type: servo) ---
  # Endpoints below are MEASURED on the rig (2026-08-06), not nominal: they are
  # the ends of the ball valve's useful sub-range, NOT hard stops — over-driving
  # stalls and cooks the servo. In the frame marked on the valve, 0% is 180 deg
  # (shut) and 100% is 93 deg (open); the servo's own zero reads as 90 there.
  # Servo needs its OWN 5-6V supply (UBEC), not the Pi rail.
  #
  # It does NOT seal without power — and it does not hold either. Measured
  # 2026-08-06: released, this servo DRIFTS off the commanded angle instead of
  # staying put, so a power cut leaves the valve at an angle nobody has
  # characterised yet (COMMISSIONING 10.7 now records it). The mechanical relief
  # is meant to cover that case but is IN HAND, NOT FITTED — until it is mounted
  # and set, the panel valve closed by hand is the only remedy.
  servo_pin: 18        # BCM hardware-PWM pin: 12, 13, 18 or 19
  servo_min_us: 520    # pulse (us) at 0%   -> LOWEST pressure (inline: closed / bleed: open)
  servo_max_us: 1167   # pulse (us) at 100% -> HIGHEST pressure (inline: open / bleed: closed)
  # SEATS the valve when a test ends. 0% above is the bottom of the CONTROL
  # range — where regulation stops, not necessarily where the valve seals; with
  # backlash in the printed coupling it can sit slightly cracked. Calibrate:
  # with the supply on, step the pulse down until flow fully stops, then add a
  # small margin. Do NOT jam it into the mechanical stop — this position is held
  # for as long as the rig sits idle and a stalled servo overheats.
  # 0 = unset -> use the 0% endpoint (previous behaviour).
  servo_close_us: 0
  close_hold_s: 1.5    # keep driving shut this long before releasing the servo

  # --- proportional solenoid (type: pwm) ---
  pwm_pin: 18
  pwm_freq_hz: 1000

# --------------------------------------------------------------- diverter ---
# 3-way solenoid. De-energised = waste/bypass (fail-safe). Energise to collect.
diverter:
  pin: 23              # BCM
  active_high: true    # true: GPIO HIGH energises the coil (via driver)

# -------------------------------------------------------------------- pid ---
# Tuned (in sim) for the ASYMMETRIC plant: strong D + soft I + setpoint ramp =
# approach from below without overshoot (overshoot is expensive: pressure only
# falls by slow permeation). The derivative is low-pass filtered inside the PID
# so sensor noise doesn't shake the servo. Re-verify on the real rig.
pid:
  kp: 4.0
  ki: 0.4
  kd: 1.0
  output_min: 0.0
  output_max: 100.0
  sample_hz: 20

# ----------------------------------------------------------------- safety ---
safety:
  max_pressure: 80.0       # HARD cutoff -> vent + abort if exceeded
  min_plausible: -5.0      # below this the sensor is considered faulted
  max_plausible: 105.0     # above sensor full-scale -> faulted
  fault_grace_reads: 3     # consecutive bad reads before declaring a fault
  # While a test runs, the cutoff tightens to max(setpoint) + this margin. A
  # 20 kPa test then aborts near 30 kPa instead of coasting to 80 — the whole
  # point being that a delicate mesh must never see pressure it wasn't asked
  # to see. 0 disables (the global cutoff governs).
  overshoot_margin: 10.0
  # WHY ABSOLUTE (not a % of setpoint): mesh damage and the specimen limit are
  # both absolute, so an absolute margin bounds the worst-case over-stress to
  # setpoint+10 kPa everywhere — the physically meaningful invariant. A relative
  # margin would be worse: at high setpoints it lets pressure coast further in
  # ABSOLUTE terms (toward the specimen limit / global cutoff); at low setpoints
  # it gets tighter than the loop's disturbance-rejection transients and
  # nuisance-aborts. Measured worst-case overshoot of the tuned loop (offline_sim,
  # +-8 kPa supply wobble): +0.82 / +0.89 / +1.42 kPa at sp 20 / 40 / 60 — so
  # 10 kPa is ~7-12x headroom. The +50%/+17% "asymmetry" is a % artefact, not a
  # physical one. FUTURE (only if the rig's pressure range ever changes): a hybrid
  #   ceiling = setpoint + max(absolute_floor, fraction*setpoint)
  # keeps tightness consistent high while guaranteeing an absolute floor low. Do
  # this then too: clamp the ceiling to the specimen limit so a fault can't push
  # the mesh past its declared limit (today sp 60 + 10 = 70 can top a 65 kPa
  # specimen). Both move the safety ladder -> Adrián's OK + Paper heads-up; NOT
  # needed at the <=35 kPa the rig actually runs.
  # After a run the feed is shut, so pressure MUST start bleeding down through
  # the membrane. If it hasn't dropped by close_check_min within close_check_s,
  # the valve did not actually seat -> warn in the UI rather than leave a
  # pressurised specimen sitting there. 0 disables.
  close_check_s: 20.0
  close_check_min: 1.0
  # Operator ceiling-raise cap (recovery flow). When a run hits its ceiling the
  # rig stops-to-safe and alarms; the operator can retry, stop, or — only if this
  # cap allows it — raise the ceiling and continue.
  # 0 = RAISING DISABLED ENTIRELY: the alarm offers only retry and stop. Any
  # positive value is additionally clamped to the specimen limit and to
  # max_pressure, so a raise can never exceed what the mesh was declared to
  # tolerate. KEEP 0 until the air-supply upper bound (panel regulator setting) is
  # known: with no mechanical relief the supply pressure is the only thing that
  # bounds a runaway, so raising must stay impossible until that number exists.
  # Global cutoff + sensor faults are NEVER recoverable or raisable.
  operator_raise_max: 0.0
  # Consecutive ceiling hits on the SAME point before the rig stops hard instead
  # of offering recovery again — repeated hits mean something physical is wrong
  # and retrying forever would just repeat the excursion.
  ceiling_retry_max: 3
  # Frozen-signal detector (the sharpest guard against a stuck sensor). A live
  # electrical signal ALWAYS carries noise (~0.15 kPa here = ~32 ADC counts, so a
  # healthy reading moves >1 LSB every sample), so the raw value being bit-
  # identical for this many consecutive reads is physically impossible with a
  # healthy sensor even if pressure is dead still — it is the signature of a dead
  # transducer or frozen I2C. Catches the worst case (a sensor stuck LOW at a
  # plausible value, which the plausibility band and the global cutoff both miss
  # because they read the same lying number). Startup: log `raw` at rest for a
  # minute and confirm it moves >1 LSB between samples; the noise floor above is a
  # model assumption until measured. If it ever false-fires, RAISE this count,
  # NEVER remove the check. 0 disables. ~10 = 0.5 s at 20 Hz.
  #
  # Why 10 and not less: during the count the PID keeps opening on the frozen-low
  # reading, and no pressure check can help (they all read the same lying sensor)
  # — measured worst case ~+27 kPa built in ~0.65 s at a high supply, bounded only
  # by the source regulator. A smaller N shrinks that blind window, BUT 10 is
  # deliberately conservative ABSENT A MEASURED NOISE FLOOR: lowering it against an
  # unknown floor risks false-firing on a quiet front-end, and a detector that
  # aborts good runs gets switched off. The prerequisite to lowering N is to wire
  # the ADS1115 and MEASURE the real front-end noise (the >1 LSB startup check
  # above gives it) — then N can drop to whatever keeps bit-identical-by-chance
  # impossible. Measure first; don't guess.
  frozen_raw_reads: 10
  # Plant-response watchdog: catches the loop losing authority over pressure —
  # valve pinned open but pressure not responding (stuck valve, shut supply, or a
  # sensor stuck low while the real cell climbs). Fires only if the valve is
  # >= watchdog_valve_pct for watchdog_hold_s AND pressure NEVER rose
  # watchdog_min_rise from where it was when the valve pinned. Integrated, not
  # dP/dt, so a legitimate plateau under an unreachable setpoint (pressure rose
  # then flattened) is left to stabilize_timeout, not aborted. Safe on any
  # measurable specimen: to hold even the 20 kPa lowest setpoint a sample must
  # build far more than 2 kPa, so only an unmeasurable (super-permeable) sample or
  # a real fault fires. watchdog_hold_s = 0 disables.
  watchdog_valve_pct: 70.0
  watchdog_hold_s: 8.0
  watchdog_min_rise: 2.0

# ------------------------------------------------------------------- test ---
test:
  # NOTE: with a servo + quarter-turn ball valve the achievable band is coarse
  # (~10-15%), not 2%. Keep tolerance_pct >= the band the valve can actually hold
  # or the sequencer will never enter COLLECTING (it will time out every setpoint).
  # The permeability result is still valid: Q is regressed vs the MEASURED mean
  # pressure per point, so a looser hold just adds scatter, not bias.
  tolerance_pct: 10.0        # +/- band as a % of the setpoint (coarse valve -> widen)
  dwell_s: 5.0               # must stay inside the band this long before collecting
  collection_s: 60.0         # permeate collection duration
  stabilize_timeout_s: 180.0 # give up stabilising a setpoint after this long
  setpoints: [20, 40, 60]    # sequence of setpoints, in `units`
  # The rig rises fast but falls SLOWLY (closing the valve doesn't drop pressure
  # quickly — it only decays by permeation). So: run points low->high, and ramp
  # the PID target so it approaches each setpoint from below without overshoot.
  sort_ascending: true       # always run setpoints in ascending order
  ramp_kpa_s: 3.0            # PID-target ramp rate (0 = jump straight to setpoint)

# -------------------------------------------------------------------- sim ---
# First-order plant model used only in mode: sim. Lets you tune logic + PID
# on a laptop with no hardware. Values are in `units`.
sim:
  supply_pressure: 100.0   # compressor/reservoir pressure (mean)
  # The real compressor does NOT hold constant pressure — it cycles. This
  # wobbles the simulated supply so you can SEE the PID rejecting it.
  supply_wobble: 8.0       # +/- amplitude of the supply oscillation
  supply_wobble_period_s: 25
  # ASYMMETRIC plant (matches the real rig): opening the valve fills FAST, but
  # closing it only lets pressure decay SLOWLY through the membrane (no vent).
  # Rise ~seconds; fall tau ~ 1/k_drain (~20 s). Overshoot is expensive to undo.
  k_in: 0.3                # inflow gain at full open (fast rise)
  k_drain: 0.05            # permeation-only decay (slow fall)
  # DERIVED CEILING (matters for sim coverage): with the valve full open the
  # plant settles at k_in*supply/(k_in+k_drain) = 0.3*100/0.35 = 85.7 kPa. That
  # is only 5.7 kPa (~7%) above the 80 kPa global cutoff — which is the ONLY
  # reason the sim can still exercise an OVERPRESSURE abort at all. Raising
  # safety.max_pressure, lowering supply_pressure, or raising k_drain shrinks (or
  # closes) that window, and the sim would then pass without ever tripping its own
  # global cutoff, silently. If you touch any of the three, re-check that the
  # ceiling still clears the cutoff with margin.
  process_noise: 0.05      # plant noise (std)
  sensor_noise: 0.15       # measurement noise (std)
  # Simulated permeate flow so sim mode auto-produces a Darcy Q-vs-dP line.
  # Q(P) = flow_per_kpa_m3s * P_kPa + flow_intercept_m3s (+/- flow_noise_frac).
  flow_per_kpa_m3s: 7.86e-7
  flow_intercept_m3s: 1.3072e-5
  flow_noise_frac: 0.02

# ------------------------------------------------------------- membrane ---
# Geometry for the Darcy permeability calc (slope method):
#   k = slope * mu * L / A   (slope = dQ/dP in (m^3/s)/Pa)
#   mean hydraulic pore size  d = sqrt(32 * k)
# Change these per membrane / mesh you test. mu (viscosity) is NOT set here — it
# comes from the water temperature (see the `temperature` block below), because
# temperature is a test variable and mu depends on it.
membrane:
  area_cm2: 0.64           # membrane active area
  thickness_mm: 0.117      # membrane thickness L (avg of >=3 measured points)
  label: "60 mesh"
  # Pressure this SPECIMEN tolerates. Meshes are delicate and this sits well
  # below the vessel/safety limit. Nothing above it can be queued or started.
  # Editable per specimen from the web UI (it can only tighten, never loosen).
  max_pressure: 65.0

# ---------------------------------------------------------- temperature ---
# Water temperature = a test variable (distilled water; you vary the bath). mu is
# computed from it automatically: mu(T) = 2.414e-5 * 10^(247.8/(T_K-140)) Pa·s
# (20 C=1.00e-3, 25 C=8.9e-4). k should come out ~constant across temperature —
# a nice sanity check, since k is geometric and only Q and mu change with T.
temperature:
  source: manual           # "probe" (DS18B20 on GPIO4, auto-logs the real temp)
                           # or "manual" (use manual_c below)
  manual_c: 21.0           # water temperature (C) when source=manual / probe fallback
  w1_id: ""                # DS18B20 id e.g. "28-01abc"; empty = auto-detect
  read_period_s: 3.0       # how often to poll the probe (slow, off the control loop)

# ------------------------------------------------------------- analysis ---
analysis:
  auto_plot: true          # auto-fit Q vs dP + save PNG when a run finishes
  title: "Q vs ΔP"

# --------------------------------------------------------------- logging ---
logging:
  dir: runs
